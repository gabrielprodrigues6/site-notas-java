<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Notas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Cadastro de Alunos</h1>

    <form id="formulario">

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" required>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" required>

        <label for="nota1">Primeira nota:</label>
        <input type="number" id="nota1" min="0" max="10" step="any" required>

        <label for="nota2">Segunda nota:</label>
        <input type="number" id="nota2" min="0" max="10" step="any" required>

        <label for="nota3">Terceira nota:</label>
        <input type="number" id="nota3" min="0" max="10" step="any" required>

        <button type="submit">Calcular media</button>
        <button type="button" id="limpar">Limpar</button>

    </form>

    <div id="resultado"></div>

</body>
</html>
